name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions: {}

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          npm run bundle
          npm run build:cli

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Tag + release the GitHub Action FIRST so a flaky/expired npm token can
      # never block consumers pinned to @v1 / @vX.Y.Z. NPM publish is decoupled below.
      - name: Create Release Tag
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes

      - name: Update Major Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag -f v1
          git push -f origin v1

      # Non-blocking: the CLI npm package is independent of the Action. If this
      # fails (e.g. expired NPM_TOKEN), the Action release above still succeeds.
      # --provenance uses the id-token permission above to attest on npm that
      # this tarball was built by this workflow from this commit.
      - name: Publish to NPM
        if: steps.check_tag.outputs.exists == 'false'
        continue-on-error: true
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
