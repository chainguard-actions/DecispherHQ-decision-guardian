name: Test invalid config rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with path traversal in decision_file
        id: action
        uses: .
        with:
          decision_file: '../etc/passwd'
          token: ${{ github.token }}
        # The action validates the decision_file path and rejects path traversal.
        # ConfigSchema.safeParse will fail with "Path traversal not allowed",
        # causing the action to throw before any health checks or PR checks.
        continue-on-error: true

      - name: Assert action failed due to invalid config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with path traversal in decision_file, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected path traversal in decision_file"
