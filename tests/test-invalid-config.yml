name: Test invalid configuration is rejected
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that path traversal in decision_file is rejected
      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: '../etc/passwd'
          fail_on_critical: 'false'
          fail_on_error: 'false'
          token: 'fake-token-for-config-test'
        env:
          GITHUB_EVENT_NAME: workflow_dispatch

      - name: Assert action failed due to invalid path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with path traversal in decision_file, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected path traversal in decision_file"
