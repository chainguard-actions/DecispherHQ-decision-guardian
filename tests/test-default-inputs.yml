name: Test default inputs and missing decision file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Do NOT create .decispher/decisions.md — test default path behavior
      # The action should fail because it's not a PR event (no pull_request payload)
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Use default decision_file path (.decispher/decisions.md)
          fail_on_critical: 'false'
          fail_on_error: 'false'
          token: 'fake-token-default-test'
        env:
          GITHUB_EVENT_NAME: workflow_dispatch

      - name: Assert action failed on non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-PR event with default inputs, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on non-PR event with default inputs"

      # Test with fail_on_critical enabled (still fails on non-PR event)
      - id: action-critical
        uses: .
        continue-on-error: true
        with:
          fail_on_critical: 'true'
          fail_on_error: 'true'
          token: 'fake-token-critical-test'
        env:
          GITHUB_EVENT_NAME: workflow_dispatch

      - name: Assert action with fail_on_critical also fails on non-PR event
        env:
          OUTCOME: ${{ steps.action-critical.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action with fail_on_critical to fail on non-PR event, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action with fail_on_critical correctly failed on non-PR event"
