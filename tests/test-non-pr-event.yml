name: Test non-PR event fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a pull_request event to fetch PR file diffs.
      # Under workflow_dispatch (as used by act), the action will fail after
      # the health check with "This action only works on pull_request events".
      # The decision file must exist for the health check to pass first.
      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: tests/fixtures/decisions.md
          token: ${{ github.token }}

      - name: Assert action failed because it is not a PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not running on a pull_request event, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not on a pull_request event"
