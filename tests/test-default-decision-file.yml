name: Test default decision file path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default decision file path (no decision_file input)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}

      - name: Assert action failed due to missing default decision file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The default decision file '.decispher/decisions.md' does not exist
          # in this repository, so the health check should fail.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when default decision file is missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when default decision file path does not exist"
