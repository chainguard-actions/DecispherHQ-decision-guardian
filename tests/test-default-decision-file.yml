name: Test default decision file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create decisions file at default path
        run: |
          mkdir -p .decispher
          cat > .decispher/decisions.md << 'EOF'
          # Architectural Decisions

          ## ADR-001: Frontend Framework
          - Status: Accepted
          - Context: We need a frontend framework
          - Decision: Use React
          - Consequences: Component-based UI, large ecosystem

          ## ADR-002: Testing Strategy
          - Status: Accepted
          - Context: We need automated testing
          - Decision: Use Jest for unit tests
          - Consequences: Fast test execution, good coverage tooling
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}

      - name: Assert action behaves correctly with default config under workflow_dispatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          # The action only works on pull_request events.
          # Under workflow_dispatch there is no PR context, so the action
          # is expected to fail with "This action only works on pull_request events".
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly reported failure when not running on a pull_request event"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with default decision_file path"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
