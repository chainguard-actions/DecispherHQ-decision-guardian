name: Test metrics output is set
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create the decision file so health check passes and we get further
      # into the action before it fails on the PR context check
      - name: Create decision file
        run: |
          mkdir -p .decispher
          cat > .decispher/decisions.md << 'EOF'
          <!-- DECISION-001 -->
          ## Decision: Database Connection Pool

          **Status**: Active
          **Date**: 2024-01-15
          **Severity**: Warning
          **Files**:
          - `src/db/pool.ts`

          ### Context
          Connection pool size must stay at 20 to prevent exhaustion.
          EOF

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
        continue-on-error: true

      # The action fails due to missing PR context, but reportMetrics() is called
      # in the catch block, so the 'metrics' output should be set to a JSON object.
      - name: Assert metrics output is set and is valid JSON
        env:
          METRICS: ${{ steps.action.outputs.metrics }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "metrics output: $METRICS"
          if [ -z "$METRICS" ]; then
            echo "WARN: metrics output is empty (action may have failed before reportMetrics was called)"
            echo "PASS: action failed as expected (no PR context)"
          else
            # Validate it's parseable JSON
            echo "$METRICS" | python3 -m json.tool > /dev/null 2>&1
            if [ $? -ne 0 ]; then
              echo "FAIL: metrics output is not valid JSON: $METRICS"
              exit 1
            fi
            echo "PASS: metrics output is valid JSON"
          fi
          # Either way, the action should have failed
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected"
