name: Test fail_on_critical false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create decisions file with critical decision
        run: |
          mkdir -p .decispher
          cat > .decispher/decisions.md << 'EOF'
          # Architectural Decisions

          ## ADR-001: No direct database access from frontend
          - Status: Accepted
          - Severity: critical
          - Pattern: db\.|database\.|mysql\.|postgres\.

          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: '.decispher/decisions.md'
          fail_on_critical: 'false'
          fail_on_error: 'false'
          token: ${{ github.token }}

      - name: Assert action ran (fail_on_critical=false should not cause extra failures)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CRITICAL: ${{ steps.action.outputs.critical_count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "critical_count: $CRITICAL"
          # The action either succeeds or fails due to GitHub API unavailability in act.
          # With fail_on_critical=false, critical decisions should NOT cause the action to fail
          # beyond any API-related failures.
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded - validating critical_count output"
            if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
              echo "FAIL: critical_count should be a non-negative integer, got: '$CRITICAL'"
              exit 1
            fi
            echo "PASS: action completed without failing due to critical decisions"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (expected in act environment without real GitHub API)"
            echo "PASS: action ran and failed gracefully"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
