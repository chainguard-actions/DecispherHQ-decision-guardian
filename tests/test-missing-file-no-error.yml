name: Test missing decision file with fail_on_error false
on:
  workflow_dispatch:

env:
  DG_TELEMETRY: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/3/merge
      GITHUB_HEAD_REF: feature-missing
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          decision_file: 'tests/fixtures/nonexistent-decisions.md'
          fail_on_critical: 'false'
          fail_on_error: 'false'

      - name: Assert action ran (missing file handled gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to missing file or token/API limitations in act,
          # but it should not be skipped or cancelled — it must have run.
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly skipped or cancelled"
            exit 1
          fi
          echo "PASS: action ran and completed (outcome=$OUTCOME)"
