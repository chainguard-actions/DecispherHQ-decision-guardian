name: Test invalid characters in decision_file path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action's config schema uses a regex /^[a-zA-Z0-9._/-]+$/ to validate
      # the decision_file path. A path with spaces or special characters should
      # cause the action to fail with "Invalid configuration".
      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: "path with spaces/decisions.md"
          token: ${{ github.token }}

      - name: Assert action failed due to invalid path characters
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid path characters, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid characters in decision_file"
