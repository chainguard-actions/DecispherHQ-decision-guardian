name: Test custom decision file path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom decision file at non-default path
        run: |
          mkdir -p docs/architecture
          cat > docs/architecture/decisions.md << 'EOF'
          <!-- DECISION-ARCH-001 -->
          ## Decision: API Rate Limiting

          **Status**: Active
          **Date**: 2024-02-01
          **Severity**: Warning
          **Files**:
          - `src/api/rate-limiter.ts`

          ### Context
          All new API endpoints must implement the standard rate limiter middleware.

          ---
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          decision_file: 'docs/architecture/decisions.md'
          fail_on_critical: 'false'
          fail_on_error: 'false'

      - name: Assert action failed at PR context check (not at file check)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there's no PR context (push event),
          # not because the custom decision file is missing.
          # Either way, the outcome should be failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed (no PR context after reading custom decision file)"
