name: Test path traversal rejected
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action's config schema rejects paths containing '..' (path traversal).
      # This should cause the action to fail with an "Invalid configuration" error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: ../etc/passwd
          token: ${{ github.token }}

      - name: Assert action failed due to path traversal
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for path traversal input, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected path traversal in decision_file"
