name: Test PR event with valid decision file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create decision file
        run: |
          mkdir -p .decispher
          cat > .decispher/decisions.md << 'EOF'
          <!-- DECISION-001 -->
          ## Decision: Database Connection Pool

          **Status**: Active
          **Date**: 2024-01-15
          **Severity**: Critical

          **Files**:
          - `src/db/pool.ts`
          - `config/database.yml`

          ### Context
          Connection pool size must stay at 20 to prevent exhaustion.

          ---

          <!-- DECISION-002 -->
          ## Decision: API Rate Limiting

          **Status**: Active
          **Date**: 2024-02-01
          **Severity**: Warning

          **Files**:
          - `src/api/**/*.ts`

          ### Context
          All new API endpoints must implement the standard rate limiter middleware.

          ---
          EOF

      - name: Create fake PR event payload
        run: |
          mkdir -p /tmp/act-events
          cat > /tmp/act-events/pull_request.json << 'EOF'
          {
            "action": "opened",
            "number": 1,
            "pull_request": {
              "number": 1,
              "title": "Test PR",
              "state": "open",
              "head": {
                "ref": "feature-branch",
                "sha": "abc123"
              },
              "base": {
                "ref": "main",
                "sha": "def456"
              }
            },
            "repository": {
              "name": "test-repo",
              "full_name": "test-owner/test-repo",
              "owner": {
                "login": "test-owner"
              }
            }
          }
          EOF

      # Run the action with a PR event context
      # The action will fail at the GitHub API call (fake token), but should
      # get past the event type check and decision file parsing
      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: '.decispher/decisions.md'
          fail_on_critical: 'false'
          fail_on_error: 'false'
          token: 'fake-token-12345'
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REF: refs/pull/1/merge
          GITHUB_HEAD_REF: feature-branch
          GITHUB_BASE_REF: main
          GITHUB_EVENT_PATH: /tmp/act-events/pull_request.json

      - name: Assert action failed at API stage (not config/event stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake token can't call the GitHub API
          # but it should NOT fail with "only works on pull_request events"
          # This confirms the action correctly recognized the PR event
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (fake token), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed PR event context (failed at API stage as expected with fake token)"
