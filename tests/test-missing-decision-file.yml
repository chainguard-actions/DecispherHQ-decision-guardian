name: Test missing decision file health check
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Do NOT create the decision file — it should not exist at the default path
      - name: Ensure default decision file does not exist
        run: |
          rm -f .decispher/decisions.md
          echo "Confirmed: .decispher/decisions.md does not exist"

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
        continue-on-error: true

      # When the decision file is missing, the health check fails immediately
      # and the action calls setFailed('System health check failed').
      # The step outcome should be 'failure'.
      - name: Assert action failed due to missing decision file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing decision file, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when decision file is missing"
