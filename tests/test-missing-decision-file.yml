name: Test missing decision file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent decision file
        id: action
        uses: .
        with:
          decision_file: '.decispher/nonexistent-decisions.md'
          token: ${{ github.token }}
        # The action will fail because the decision file doesn't exist
        # (health check fails) or because it's not a pull_request event.
        # Either way, the action sets a failure — we allow it to fail here.
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when decision file is missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when decision file is missing"
