name: Test missing decision file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure decision file does not exist
        run: |
          rm -f .decispher/decisions.md
          echo "Confirmed: decision file does not exist"

      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: '.decispher/decisions.md'
          fail_on_critical: 'false'
          fail_on_error: 'false'
          token: ${{ github.token }}

      - name: Assert action handled missing decision file gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MATCHES: ${{ steps.action.outputs.matches_found }}
          CRITICAL: ${{ steps.action.outputs.critical_count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "matches_found: $MATCHES"
          echo "critical_count: $CRITICAL"
          # When the decision file is missing, the action should fail gracefully
          # (health check fails) rather than crashing the runner.
          # With fail_on_error=false, the action may still fail due to missing file
          # or GitHub API unavailability in act environment.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and completed (outcome: $OUTCOME) without crashing the runner"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
