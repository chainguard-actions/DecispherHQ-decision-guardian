name: Test missing decision file with fail_on_error false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no decisions file exists
        run: |
          rm -rf .decispher
          echo "Removed .decispher directory (if it existed)"

      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: '.decispher/decisions.md'
          fail_on_critical: 'false'
          fail_on_error: 'false'
          token: ${{ github.token }}

      - name: Assert action failed due to missing file or no PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          # When the decision file is missing, checkDecisionFileExists returns false
          # and the action calls setFailed('System health check failed').
          # Additionally, under workflow_dispatch there is no PR context.
          # Either way, the action is expected to fail (not crash unexpectedly).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly reported failure (missing file or no PR context)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
