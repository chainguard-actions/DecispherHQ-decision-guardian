name: Test missing decision file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with a non-existent decision file.
      # The health check validates the file exists first; when it doesn't,
      # validateHealth returns false and the action calls core.setFailed.
      # We use continue-on-error so we can assert on the outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: tests/fixtures/nonexistent-decisions.md
          token: ${{ github.token }}

      - name: Assert action failed due to missing decision file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when decision file is missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when decision file is missing"
