name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create decisions file
        run: |
          mkdir -p .decispher
          cat > .decispher/decisions.md << 'EOF'
          # Architectural Decisions

          ## ADR-001: Use TypeScript for all new services
          - Status: Accepted
          - Severity: low
          - Pattern: typescript|\.ts$

          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: '.decispher/decisions.md'
          fail_on_critical: 'false'
          fail_on_error: 'false'
          token: ${{ github.token }}

      - name: Assert action ran (outputs or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MATCHES: ${{ steps.action.outputs.matches_found }}
          CRITICAL: ${{ steps.action.outputs.critical_count }}
          METRICS: ${{ steps.action.outputs.metrics }}
        run: |
          echo "outcome: $OUTCOME"
          echo "matches_found: $MATCHES"
          echo "critical_count: $CRITICAL"
          echo "metrics: $METRICS"
          # The action either succeeds (with numeric outputs) or fails gracefully
          # due to GitHub API not being available in act environment.
          # Either way, the action must have run (not crashed the runner).
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded - validating outputs"
            if ! echo "$MATCHES" | grep -qE '^[0-9]+$'; then
              echo "FAIL: matches_found should be a non-negative integer, got: '$MATCHES'"
              exit 1
            fi
            if ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
              echo "FAIL: critical_count should be a non-negative integer, got: '$CRITICAL'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (expected in act environment without real GitHub API)"
            echo "PASS: action ran and failed gracefully"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
