name: Test telemetry_enabled input accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that telemetry_enabled=true is accepted as a valid boolean input.
      # The action should still fail because it's not running on a pull_request
      # event (workflow_dispatch is used by act), but it should NOT fail due to
      # an invalid input value for telemetry_enabled.
      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: tests/fixtures/decisions.md
          telemetry_enabled: 'true'
          token: ${{ github.token }}

      - name: Assert action failed for expected reason (not PR event), not input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because it's not a PR event (after health check passes),
          # not because of an invalid telemetry_enabled value.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (not on PR event), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: telemetry_enabled=true accepted; action failed for expected reason (not PR event)"
