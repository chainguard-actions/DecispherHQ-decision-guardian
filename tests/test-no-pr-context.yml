name: Test no PR context
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create decision file
        run: |
          mkdir -p .decispher
          cat > .decispher/decisions.md << 'EOF'
          <!-- DECISION-001 -->
          ## Decision: Database Connection Pool

          **Status**: Active
          **Date**: 2024-01-15
          **Severity**: Critical
          **Files**:
          - `src/db/pool.ts`

          ### Context
          Connection pool size must stay at 20 to prevent exhaustion.

          ---
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          decision_file: '.decispher/decisions.md'
          fail_on_critical: 'false'
          fail_on_error: 'false'

      - name: Assert action failed due to no PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in a PR context, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not in a PR context"
