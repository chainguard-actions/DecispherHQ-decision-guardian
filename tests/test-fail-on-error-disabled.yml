name: Test fail_on_error disabled with missing file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With fail_on_error=false (the default), parse errors in the decision file
      # are treated as warnings rather than failures. However, the health check
      # still validates that the file exists. A missing file causes health check
      # failure regardless of fail_on_error setting.
      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: tests/fixtures/nonexistent.md
          fail_on_error: 'false'
          token: ${{ github.token }}

      - name: Assert action failed due to health check (file missing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when decision file is missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when decision file is missing (health check)"
