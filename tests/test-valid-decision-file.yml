name: Test valid decision file (non-PR context)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid decision file
        id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: 'tests/fixtures/decisions.md'
          fail_on_critical: 'false'
          fail_on_error: 'false'
          token: ${{ github.token }}

      - name: Assert action failed due to non-PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch there is no pull_request context,
          # so the action is expected to fail with a pull_request error.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in non-PR context, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed in non-PR context"

      - name: Assert metrics output is set
        env:
          METRICS: ${{ steps.action.outputs.metrics }}
        run: |
          echo "metrics: $METRICS"
          # metrics output is set by reportMetrics() which is called in the catch block
          if [ -z "$METRICS" ]; then
            echo "WARN: metrics output was not set (may be expected if action failed before reportMetrics)"
          else
            # Validate it's valid JSON
            echo "$METRICS" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null && \
              echo "PASS: metrics is valid JSON" || \
              echo "WARN: metrics is not valid JSON: $METRICS"
          fi
