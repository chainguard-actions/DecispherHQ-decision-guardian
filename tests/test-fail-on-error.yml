name: Test fail_on_error input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fail_on_error enabled and valid decision file
        id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: 'tests/fixtures/decisions.md'
          fail_on_critical: 'false'
          fail_on_error: 'true'
          token: ${{ github.token }}

      - name: Assert action failed (expected in non-PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no pull_request context
          # under workflow_dispatch. fail_on_error only matters during parsing,
          # which happens before the PR context check in the provider constructor.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in non-PR context, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with fail_on_error=true in non-PR context"
