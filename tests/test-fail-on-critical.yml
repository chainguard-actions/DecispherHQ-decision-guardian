name: Test fail_on_critical flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create decisions file with critical decision
        run: |
          mkdir -p .decispher
          cat > .decispher/decisions.md << 'EOF'
          # Architectural Decisions

          ## ADR-001: Security Requirements
          - Status: Accepted
          - Severity: critical
          - Context: All API endpoints must be authenticated
          - Decision: Use JWT tokens for authentication
          - Consequences: Secure API access

          ## ADR-002: Code Style
          - Status: Accepted
          - Severity: warning
          - Context: Consistent code style improves readability
          - Decision: Use ESLint with standard config
          - Consequences: Consistent codebase
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: '.decispher/decisions.md'
          fail_on_critical: 'true'
          fail_on_error: 'false'
          token: ${{ github.token }}

      - name: Assert action behaves correctly with fail_on_critical under workflow_dispatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          # The action only works on pull_request events.
          # Under workflow_dispatch there is no PR context, so the action
          # is expected to fail with "This action only works on pull_request events".
          # With fail_on_critical=true, a failure is also expected if critical violations found.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly reported failure (no PR context or critical violation)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
