name: Test fail_on_critical input accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create decisions file with critical decision
        run: |
          mkdir -p .decispher
          cat > .decispher/decisions.md << 'EOF'
          <!-- DECISION-001 -->
          ## Decision: No Hardcoded Secrets

          **Status**: Active
          **Date**: 2024-01-15
          **Severity**: Critical
          **Files**:
          - `src/**/*.ts`

          ### Context
          Hardcoded credentials must never appear in source files.
          EOF

      - name: Run action with fail_on_critical enabled
        id: action
        uses: .
        with:
          decision_file: '.decispher/decisions.md'
          fail_on_critical: 'true'
          fail_on_error: 'false'
          token: ${{ github.token }}
        # The action will fail because it only works on pull_request events.
        # This test verifies that fail_on_critical input is accepted without
        # config validation errors, and the action fails at the PR check stage.
        continue-on-error: true

      - name: Assert action failed at PR check (not config validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (not on PR event), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not on a pull_request event (fail_on_critical input accepted)"
