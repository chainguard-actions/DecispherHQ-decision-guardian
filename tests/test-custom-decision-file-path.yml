name: Test custom decision file path input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a custom decision file at a non-default path
      - name: Create custom decision file
        run: |
          mkdir -p docs/decisions
          cat > docs/decisions/arch.md << 'EOF'
          <!-- DECISION-001 -->
          ## Decision: API Rate Limiting

          **Status**: Active
          **Date**: 2024-02-01
          **Severity**: Warning
          **Files**:
          - `src/api/**/*.ts`

          ### Context
          All new API endpoints must implement the standard rate limiter middleware.
          EOF

      - id: action
        uses: .
        with:
          decision_file: 'docs/decisions/arch.md'
          token: ${{ github.token }}
        continue-on-error: true

      # The action will fail because it requires a pull_request event context.
      # However, it should NOT fail with a config validation error —
      # the custom path is valid and passes the schema check.
      # The failure should be due to missing PR context (after health checks pass).
      - name: Assert action failed for expected reason (no PR context, not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed custom decision_file input and failed at PR context check"
