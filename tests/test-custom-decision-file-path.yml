name: Test custom decision file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create decisions file at custom path
        run: |
          mkdir -p docs/decisions
          cat > docs/decisions/adr.md << 'EOF'
          # Architectural Decision Records

          ## ADR-001: Use REST APIs over GraphQL for external integrations
          - Status: Accepted
          - Severity: low
          - Pattern: graphql|\.gql$|apollo

          ## ADR-002: All secrets must use environment variables
          - Status: Accepted
          - Severity: high
          - Pattern: hardcoded_secret|password\s*=\s*["'][^"']+["']

          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          decision_file: 'docs/decisions/adr.md'
          fail_on_critical: 'false'
          fail_on_error: 'false'
          token: ${{ github.token }}

      - name: Assert action ran with custom decision file path
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MATCHES: ${{ steps.action.outputs.matches_found }}
          METRICS: ${{ steps.action.outputs.metrics }}
        run: |
          echo "outcome: $OUTCOME"
          echo "matches_found: $MATCHES"
          echo "metrics: $METRICS"
          # The action either succeeds (with numeric outputs) or fails gracefully
          # due to GitHub API not being available in act environment.
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded - validating outputs"
            if ! echo "$MATCHES" | grep -qE '^[0-9]+$'; then
              echo "FAIL: matches_found should be a non-negative integer, got: '$MATCHES'"
              exit 1
            fi
            if [ -n "$METRICS" ]; then
              echo "metrics output present: $METRICS"
              if ! echo "$METRICS" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
                echo "WARN: metrics output is not valid JSON, but action completed"
              fi
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (expected in act environment without real GitHub API)"
            echo "PASS: action ran and failed gracefully"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
